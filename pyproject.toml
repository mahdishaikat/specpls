[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specpls"
version = "0.2.0"
description = "PLS calibration models for process spectroscopy (Raman, NIR) in bioprocessing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mahdi Mubin Shaikat" }]
keywords = ["chemometrics", "PLS", "Raman", "spectroscopy", "PAT", "bioprocess"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "matplotlib>=3.7",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
specpls = "specpls.cli:main"

[project.urls]
Documentation = "https://mahdishaikat.github.io/specpls"
Source = "https://github.com/mahdishaikat/specpls"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- testing
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --doctest-modules --import-mode=importlib"
filterwarnings = ["error::FutureWarning"]
markers = ["slow: longer-running end-to-end tests"]

[tool.coverage.run]
source = ["specpls"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- linting
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "NPY", "SIM"]
ignore = [
    "N803", "N806",  # allow X, X_test etc. (standard in chemometrics)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
"examples/*" = ["E402"]  # matplotlib backend must be set before imports
