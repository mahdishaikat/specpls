name: Release

# Runs when a version tag such as v0.2.1 is pushed:
#   git tag v0.2.1 && git push origin v0.2.1
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and build tools
        run: pip install -e ".[dev]" build

      - name: Check the tag matches the package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in pyproject.toml"
            exit 1
          fi

      - name: Run the test suite
        run: pytest

      - name: Build wheel and source distribution
        run: python -m build

      - name: Create the GitHub Release with the built package attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "specpls $GITHUB_REF_NAME" \
            --generate-notes
